services:

  fastapi-app:
    build: .
    container_name: fastapi_app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_ARTIFACT_URI: s3://mlflow
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    command: uvicorn api.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped

  streamlit:
    build: .
    volumes:
      - .:/app
    command: streamlit run streamlit_app.py --server.port 7860 --server.address 0.0.0.0
    ports:
      - "7860:7860"
    depends_on:
      fastapi-app:
        condition: service_started

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlflow
    environment:
      MLFLOW_ARTIFACT_URI: s3://mlflow
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1     # requis par boto3 même pour MinIO
    ports:
      - "5001:5000"
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      - --default-artifact-root
      - s3://mlflow
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully   # attend la création du bucket
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    # FIX: suppression du suffixe -cpuv1 — utilise l'image native ARM sur Mac Silicon
    # cpuv1 est une image x86 émulée via Rosetta → instable et lente sur M1/M2/M3
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --address ":9000" --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    # FIX: crée le bucket mlflow automatiquement au démarrage
    # Sans ça, MLflow échoue à uploader les artifacts si le bucket n'existe pas
    image: minio/mc:latest
    container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing myminio/mlflow &&
        echo 'Bucket mlflow ready'
      "
    restart: "no"   # ne tourne qu'une seule fois

volumes:
  pgdata:
  miniodata: